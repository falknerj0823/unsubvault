# One grouped pull request per area, monthly, and never a major-version jump (those are done by hand after testing).
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups: {python: {patterns: ["*"]}}
    ignore: [{dependency-name: "*", update-types: ["version-update:semver-major"]}]
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    groups: {javascript: {patterns: ["*"]}}
    ignore: [{dependency-name: "*", update-types: ["version-update:semver-major"]}]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups: {actions: {patterns: ["*"]}}
    ignore: [{dependency-name: "*", update-types: ["version-update:semver-major"]}]
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    ignore: [{dependency-name: "*", update-types: ["version-update:semver-major"]}]
  - package-ecosystem: docker
    directory: /frontend
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    ignore: [{dependency-name: "*", update-types: ["version-update:semver-major"]}]
